global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: shipper
    static_configs: [{ targets: ["shipper:8001"] }]
  - job_name: indexer
    static_configs: [{ targets: ["indexer:8000"] }]
  - job_name: nginx
    static_configs: [{ targets: ["nginx-exporter:9113"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: elasticsearch
    static_configs: [{ targets: ["es-exporter:9114"] }]
