worker_processes auto;
events { worker_connections 1024; }

http {
    # 以 JSON 格式輸出 access log，下游不必再用正規表達式解析
    log_format json escape=json '{'
        '"time_iso8601":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    # 模擬一個小型電商 API（官方映像把預設 access.log 導向 stdout，所以另開一個路徑）
    server {
        listen 80;
        access_log /var/log/nginx/app/access.json json;
        default_type application/json;

        location = /                     { return 200 '{"service":"demo-shop","status":"ok"}'; }
        location = /api/products         { return 200 '[{"id":1,"name":"keyboard"},{"id":2,"name":"mouse"}]'; }
        location ~ ^/api/products/\d+$   { return 200 '{"id":1,"name":"keyboard","price":1290}'; }
        location = /api/orders           { return 201 '{"order":"created"}'; }
        location = /api/error            { return 500 '{"error":"internal server error"}'; }
        location /                       { return 404 '{"error":"not found"}'; }
    }

    # 給 nginx-prometheus-exporter 讀取的狀態頁，不對外開放
    server {
        listen 8080;
        access_log off;
        location = /nginx_status { stub_status; }
    }
}
